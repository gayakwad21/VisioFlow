<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisioFlow | Register</title>
  <link rel="stylesheet" href="/css/style.css?v=20261011-orange-2">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="/" aria-label="VisioFlow home">
      <img src="/static/assets/images/visioflow-logo.png?v=2" alt="VisioFlow logo">
      <span>VisioFlow</span>
    </a>
    <section class="auth-card">
      <p class="eyebrow">CREATE YOUR WORKSPACE</p>
      <h1>Create account</h1>
      <p class="auth-description">Start building visual computer vision workflows.</p>
    
    <div id="error-msg" role="alert"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" required placeholder="Choose username">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" required placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" required minlength="6" placeholder="Choose password">
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html">Log In</a>
    </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById('error-msg');
      errDiv.style.display = 'none';

      const u = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const p = document.getElementById('password').value;

      try {
        await API.register(u, email, p);
        window.location.href = '/dashboard.html';
      } catch (err) {
        errDiv.textContent = err.message || 'Registration failed';
        errDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
